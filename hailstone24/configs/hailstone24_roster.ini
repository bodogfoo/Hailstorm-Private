# Hailstone 24 Multibox Roster Template (NO PASSWORDS STORED HERE)
# Passwords live strictly inside the system keyring via:
#   hailstone --data-dir ~/.local/share/hailstone24 --import-mq-logins /path/to/login.db --roster-out ~/.local/share/hailstone24/hailstone24_roster.ini

[global]
default_server=ez-server
# Exact world name, numeric ID, or unique keyword filter (e.g. "EZ" matches "EZ (Linux) x2/x4"):
default_world=EZ Server
bg_tick_hz=25
gpu_mode=cached
auto_kick=1

[slot01]
