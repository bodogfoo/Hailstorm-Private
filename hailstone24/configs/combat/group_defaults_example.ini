; Hailstone Native Combat Profile Example — Group Defaults
; Place in ${HAILSTONE_DATA_DIR}/profiles/<group_id>.combat.ini
; Character combat_profile.ini overrides any non-empty fields set here.
; Never store account names, passwords, or keyring secrets in combat profiles.

[General]
mode=group
auto_loadout=false
rememorize_missing=true
allow_pet_attack=true
use_abilities=true

[Targeting]
assist_target=main_assist
engage_at_hp_pct=98
max_engage_distance=160
follow_distance=18

[Movement]
movement_mode=AssistRange
assist_range=95
melee_range=12
ranged_min_range=25
ranged_max_range=125
disengage_distance=180
pause_on_manual_move=true
manual_override_cooldown_ms=4000

[Safety]
retreat_hp_pct=18
retreat_distance=55
stop_cast_on_retreat=true
stop_attack_on_target_loss=true
