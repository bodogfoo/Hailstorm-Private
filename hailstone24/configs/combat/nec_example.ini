; Hailstone Native Combat Profile Example — Necromancer (NEC)
; Place at <character_dir>/combat_profile.ini inside ${HAILSTONE_DATA_DIR}
; No MacroQuest / RGMercs scripts or /stick commands required.

[General]
profile_name=Necromancer Native Group/Solo
class=NEC
role=ranged_dps
mode=group
dry_run=false
auto_loadout=false
rememorize_missing=true
allow_melee_attack=false
allow_pet_attack=true
replace_rules=true
use_abilities=false

[Targeting]
assist_target=main_assist
engage_at_hp_pct=98
max_engage_distance=150
follow_distance=20

[Movement]
movement_mode=RangedRange
assist_range=95
melee_range=12
ranged_min_range=25
ranged_max_range=135
disengage_distance=185
melee_behind=false
pause_on_manual_move=true
manual_override_cooldown_ms=4000

[Safety]
retreat_hp_pct=20
retreat_distance=55
stop_cast_on_retreat=true
stop_attack_on_target_loss=true

[Loadout]
; Pipe-separated fallbacks automatically pick the highest-ranked spell in your spellbook.
gem1=Splurt|Pyrocruor|Blood of Thule|Cessation of Cor|Boiling Blood|Heat Blood
gem2=Scent of Terris|Scent of Darkness|Scent of Shadow|Scent of Dusk
gem3=Dooming Darkness|Cascading Darkness|Engulfing Darkness|Clinging Darkness
gem4=Siphon Life|Drain Soul|Drain Spirit|Lifetap|Lifespike|Lifedraw
gem5=Horror|Funeral Pyre of Kelador|Venom of the Snake|Envenomed Bolt|Poison Bolt
gem6=Renew Bones|Mend Bones|Convoke Shadow|Animate Dead
gem7=Seduction of Saryrn|Arch Lich|Demi Lich|Lich|Call of Bones|Dark Pact
gem8=Feign Death|Harmshield

[Rule.NecLifetap]
spell=Siphon Life|Drain Soul|Drain Spirit|Lifetap|Lifespike|Lifedraw
action=cast
target=HostileTarget
condition=InCombatOnly
priority=95
self_max_hp_pct=70
min_mana_pct=5
max_range=150
cooldown_ms=4000
detrimental=true
enabled=true

[Rule.NecFeignEscape]
spell=Feign Death|Harmshield
action=cast
target=Self
condition=Always
priority=100
self_max_hp_pct=20
cooldown_ms=15000
detrimental=false
enabled=true

[Rule.NecScentDebuff]
spell=Scent of Terris|Scent of Darkness|Scent of Shadow|Scent of Dusk
action=cast
target=HostileTarget
condition=InCombatOnly
priority=85
target_min_hp_pct=35
require_buff_missing=true
cooldown_ms=25000
detrimental=true
enabled=true

[Rule.NecSnareDarkness]
spell=Dooming Darkness|Cascading Darkness|Engulfing Darkness|Clinging Darkness
action=cast
target=HostileTarget
condition=InCombatOnly
priority=80
target_min_hp_pct=20
require_buff_missing=true
cooldown_ms=24000
detrimental=true
enabled=true

[Rule.NecDotPrimary]
spell=Splurt|Pyrocruor|Blood of Thule|Cessation of Cor|Boiling Blood|Heat Blood
action=cast
target=HostileTarget
condition=InCombatOnly
priority=75
target_min_hp_pct=25
min_mana_pct=15
require_buff_missing=true
cooldown_ms=18000
detrimental=true
enabled=true

[Rule.NecDotSecondary]
spell=Horror|Funeral Pyre of Kelador|Venom of the Snake|Envenomed Bolt|Poison Bolt
action=cast
target=HostileTarget
condition=InCombatOnly
priority=65
target_min_hp_pct=25
min_mana_pct=20
require_buff_missing=true
cooldown_ms=18000
detrimental=true
enabled=true
