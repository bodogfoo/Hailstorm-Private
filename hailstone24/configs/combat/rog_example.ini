; Hailstone Native Combat Profile Example — Rogue (ROG)
; Place at <character_dir>/combat_profile.ini inside ${HAILSTONE_DATA_DIR}

[General]
profile_name=Rogue Native Melee DPS
class=ROG
role=melee_dps
mode=group
dry_run=false
auto_loadout=false
rememorize_missing=false
allow_melee_attack=true
allow_pet_attack=false
replace_rules=true
use_abilities=true

[Targeting]
assist_target=main_assist
engage_at_hp_pct=98
max_engage_distance=140
follow_distance=16

[Movement]
movement_mode=MeleeRange
assist_range=95
melee_range=11
disengage_distance=165
melee_behind=true
pause_on_manual_move=true
manual_override_cooldown_ms=4000

[Safety]
retreat_hp_pct=15
retreat_distance=45
stop_cast_on_retreat=true
stop_attack_on_target_loss=true

[Rule.RogBackstab]
spell=Backstab
action=ability
target=HostileTarget
condition=InCombatOnly
priority=95
max_range=14
cooldown_ms=6000
detrimental=true
enabled=true

[Rule.RogDisarm]
spell=Disarm
action=ability
target=HostileTarget
condition=InCombatOnly
priority=40
max_range=14
cooldown_ms=15000
detrimental=true
enabled=true
