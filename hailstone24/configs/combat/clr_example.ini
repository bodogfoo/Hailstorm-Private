; Hailstone Native Combat Profile Example — Cleric (CLR)
; Place at <character_dir>/combat_profile.ini inside ${HAILSTONE_DATA_DIR}

[General]
profile_name=Cleric Native Healer
class=CLR
role=healer
mode=group
dry_run=false
auto_loadout=false
rememorize_missing=true
allow_melee_attack=false
allow_pet_attack=false
replace_rules=true
use_abilities=false

[Targeting]
assist_target=main_assist
engage_at_hp_pct=99
max_engage_distance=150
follow_distance=20

[Movement]
movement_mode=Follow
assist_range=90
melee_range=10
ranged_min_range=20
ranged_max_range=115
disengage_distance=160
melee_behind=false
pause_on_manual_move=true
manual_override_cooldown_ms=4000

[Safety]
retreat_hp_pct=15
retreat_distance=50
stop_cast_on_retreat=false
stop_attack_on_target_loss=true

[Loadout]
gem1=Complete Heal|Superior Healing|Greater Healing|Healing|Light Healing|Minor Healing
gem2=Holy Light|Pious Remedy|Supernal Remedy|Ethereal Remedy|Remedy
gem3=Word of Vivification|Word of Replenishment|Word of Redemption|Word of Restoration|Word of Health
gem4=Blessing of Devotion|Hand of Virtue|Kazad's Mark|Aegolism|Symbol of Marzin|Heroic Bond
gem5=Elixir of Divinity|Celestial Elixir|Celestial Healing
gem6=Stun|Sound of Force|Command of Druzzil

[Rule.ClrEmergencyPatch]
spell=Holy Light|Pious Remedy|Supernal Remedy|Ethereal Remedy|Remedy
action=cast
target=GroupLowestHp
condition=Always
priority=100
self_max_hp_pct=45
min_mana_pct=5
max_range=160
cooldown_ms=2500
detrimental=false
enabled=true

[Rule.ClrGroupHeal]
spell=Word of Vivification|Word of Replenishment|Word of Redemption|Word of Restoration|Word of Health
action=cast
target=GroupLowestHp
condition=Always
priority=90
self_max_hp_pct=75
min_mana_pct=12
max_range=120
cooldown_ms=5000
detrimental=false
enabled=true

[Rule.ClrMainHeal]
spell=Complete Heal|Superior Healing|Greater Healing|Healing|Light Healing|Minor Healing
action=cast
target=GroupLowestHp
condition=Always
priority=80
self_max_hp_pct=65
min_mana_pct=10
max_range=160
cooldown_ms=6000
detrimental=false
enabled=true

[Rule.ClrBuff]
spell=Blessing of Devotion|Hand of Virtue|Kazad's Mark|Aegolism|Symbol of Marzin|Heroic Bond
action=cast
target=Self
condition=OutOfCombatOnly
priority=30
min_mana_pct=30
require_buff_missing=true
cooldown_ms=30000
detrimental=false
enabled=true
