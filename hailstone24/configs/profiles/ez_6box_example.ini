# Example MacroQuest-style Group Profile for Project Hailstone 24.
# Copy to <hailstone_data_dir>/profiles/<name>.ini and customize for your accounts.
# Never put passwords in this file; passwords stay solely in your system keyring.

[profile]
name=EZ 6-Box Example
description=Sample EZ Server melee/caster box group launched in deterministic slot order
default_server=ez_server
default_world=EZ Server
auto_login=1
auto_kick=1
bg_tick_hz=25
gpu_mode=cached

[slot01]
slot_number=1
launch_order=1
enabled=1
session_id=slot01
character=Stabbinyah
account=pumpkin
server_id=ez_server
world=EZ Server
class_role=ROG
settings_path=servers/ez_server/characters/EZ Server/Stabbinyah/hailstone.ini
auto_login=1
headless=0

[slot02]
slot_number=2
launch_order=2
enabled=1
session_id=slot02
character=TankExample
account=acct02
server_id=ez_server
world=EZ Server
class_role=WAR
settings_path=servers/ez_server/characters/EZ Server/TankExample/hailstone.ini
auto_login=1
headless=1

[slot03]
slot_number=3
launch_order=3
enabled=1
