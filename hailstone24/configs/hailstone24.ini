# Project Hailstone 24 - Isolated Client Configuration
# Place in $HAILSTONE_DATA_DIR/hailstone.ini (never inside your EverQuest folder).

[assets]
# Point read-only to your legally obtained RoF2 EverQuest client directory:
# path=/opt/eq/rof2
path=

[display]
lighting=modern
max_fps=60
background_fps=-1
vsync=1
msaa=2
shadows=1024
light_shadows=4
ao=1
bloom=0.35
render_scale=100
upscaler=none
smooth_ground=1

[game]
# Keep 60 Hz deterministic mechanics independent of frame presentation rate
fixed_step=1

[audio]
# Background sessions automatically mute until switched to FOREGROUND_FULL
mute=0
volume=0.5

[scripts]
# Optional character/account Lua autorun (e.g. rgmercs)
autoload=

[login]
# Set auto_login=1 to automatically log in on startup using your remembered server/account/keyring password,
# auto-select your world (saved world -> last world -> sole favorite), and auto-enter a single-character account.
auto_login=0
# Automatically answer Yes to "Character still logged in? Kick?" when auto-logging in or running headless.
auto_kick=1

[multibox]
# Hailstone 24 background simulation frequency (10..60 Hz; default 25 Hz)
bg_tick_hz=25
# GPU memory retention in BACKGROUND_HEADLESS:
#   cached        = retain zone/actor buffers for <250ms foreground switching (recommended on 32 GB VRAM Arc Pro B70)
#   deferred      = aggressively release transient scene targets when backgrounded
#   shared-broker = import shared zone/actor GPU textures via hailstone_gpu_cache_broker (VK_KHR_external_memory_fd)
gpu_mode=cached
# Set box_launch_headless=1 to launch additional Box Set windows in BACKGROUND_HEADLESS mode
box_launch_headless=0
auto_connect_bus=1
# Leave ipc_socket empty to use $XDG_RUNTIME_DIR/hailstone24/bus.sock
ipc_socket=
